name: LinkedIn Contract Scraper (no email lookup)

# Lightweight version — skips Hunter.io + GPT domain resolution entirely.
# Use this for testing/development to avoid unnecessary API spend.
# Trigger manually from the GitHub Actions UI.

on:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  scrape-and-enrich:
    name: Scrape + Enrich LinkedIn Contracts (no email)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape and enrich LinkedIn contracts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # HUNTER_API_KEY intentionally omitted — skips all email lookup
          MIN_DELAY_MS: 1500
          MAX_DELAY_MS: 3000
        run: npx tsx scripts/scrape-and-enrich.ts
