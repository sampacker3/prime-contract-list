name: LinkedIn Contract Scraper (scheduled)

# Runs every 2 hours automatically. Scrapes LinkedIn, enriches with OpenAI,
# resolves recruiter emails via Clearbit, and sends alert emails via Resend.

on:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scrape-and-enrich:
    name: Scrape + Enrich LinkedIn Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape and enrich LinkedIn contracts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MIN_DELAY_MS: 1500
          MAX_DELAY_MS: 3000
        run: npx tsx scripts/scrape-and-enrich.ts
